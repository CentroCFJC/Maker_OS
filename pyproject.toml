[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makeros"
version = "0.1.0"
description = "MakerOS — operating system for a prototyping lab. Markdown-first, self-hosted, AI-integrated."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "watchfiles>=0.21",
    "markdown-it-py>=3.0",
    "python-frontmatter>=1.1",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["makeros*"]

[tool.setuptools.package-data]
makeros = ["web/templates/*.html", "web/static/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
