<span data-modal-title hidden>Restablecer contraseña</span>
<form class="modal-form"
      hx-post="/admin/usuarios/{{ target['id'] }}/clave"
      hx-target="#makeros-modal-body" hx-swap="innerHTML">
  {% if error %}<p class="modal-error">{{ error }}</p>{% endif %}
  <p class="modal-note">Nueva contraseña para <strong>{{ target['username'] }}</strong>.
    La persona tendrá que volver a iniciar sesión.</p>
  <label>Nueva contraseña (mínimo 8 caracteres)
    <input type="password" name="password" minlength="8" required autofocus>
  </label>
  <div class="modal-actions">
    <button type="button" class="btn-ghost" onclick="makerosCloseModal()">Cancelar</button>
    <button type="submit" class="btn-primary admin-danger"
            onclick="makerosConfirmSubmit(this, event)">Restablecer contraseña</button>
  </div>
</form>
