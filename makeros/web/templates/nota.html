{% extends "base.html" %}
{% block title %}MakerOS — {{ title }}{% endblock %}
{% block content %}
<article class="notion-page">
  <header class="page-header">
    <p class="breadcrumb"><a href="/notas">Mis notas</a> / {{ title }}</p>
    <div class="page-header-row">
      <h1 class="page-title-with-icon">
        {{ icon("lock") }}
        <span>{{ title }}</span>
      </h1>
    </div>
    {% if tags %}
    <div class="page-tags">
      {% for tag in tags %}<span class="page-tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="blocks">
    {% include "_block.html" %}
  </div>
</article>
{% endblock %}
