<div class="block block-editing" id="block-{{ i }}">
  <form hx-post="{{ page_url }}/bloques/{{ i }}/editar"
        hx-target="#block-{{ i }}" hx-swap="outerHTML" class="block-form">
    <div class="slash-wrap">
      <textarea name="text" rows="6" autofocus
                data-slash-input>{{ text }}</textarea>
      <div class="slash-menu" data-slash-menu hidden>
        <p class="slash-hint">Bloques — escribe para filtrar, Esc para cerrar</p>
        {% for tipo, label in block_types.items() %}
        <button type="button" class="slash-item" data-tipo="{{ tipo }}"
                data-seed="{{ block_seeds[tipo] | tojson }}">
          {{ icon(block_icons.get(tipo), cls="icon") }}<span>{{ label }}</span>
        </button>
        {% endfor %}
      </div>
    </div>
    {% if tipo == "imagen" %}
    <div class="block-image-tools">
      <label class="btn-ghost btn-upload">
        Subir imagen
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden
               onchange="makerosUploadBlockImage(this)">
      </label>
      <input type="url" class="block-image-url" placeholder="…o pega una URL de imagen"
             aria-label="URL de la imagen">
      <button type="button" class="btn-ghost" onclick="makerosInsertImageUrl(this)">
        Usar URL</button>
      <span class="block-upload-status" data-upload-status></span>
    </div>
    {% endif %}
    <div class="block-form-actions">
      <span class="block-form-hint">Enter guarda · Mayús+Enter salto de línea · / inserta bloques · Esc cierra</span>
      <button type="submit" class="btn-ghost">Guardar</button>
      <button type="button" class="btn-ghost"
              hx-get="{{ page_url }}/bloques/{{ i }}"
              hx-target="#block-{{ i }}" hx-swap="outerHTML">Cerrar</button>
    </div>
  </form>
</div>
