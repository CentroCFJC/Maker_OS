<details class="add-menu">
  <summary>+ Añadir bloque</summary>
  <div class="add-menu-panel">
    <form method="post" action="{{ page_url }}/bloques/nuevo">
      <input type="hidden" name="despues" value="-1">
      {% for tipo, label in block_types.items() %}
      <button type="submit" name="tipo" value="{{ tipo }}" class="menu-item">
        {{ icon(block_icons.get(tipo), cls="icon") }}<span>{{ label }}</span>
      </button>
      {% endfor %}
    </form>
  </div>
</details>
